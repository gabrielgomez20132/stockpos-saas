server {
    listen 80;
    server_name _;
    root /var/www/stokpos/public;
    index index.php;
    charset utf-8;
    client_max_body_size 40M;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Fotos de productos: SIEMPRE como archivo estatico. El "^~" impide que un
    # /uploads/algo.php llegue a PHP (si no, una subida se volveria codigo ejecutable).
    location ^~ /uploads/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # Archivos de Vite: llevan hash en el nombre, se pueden cachear para siempre
    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker (venta sin conexion): nunca en cache, si no los equipos
    # se quedan con la version vieja de la aplicacion despues de un deploy.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass stokpos_app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }

    # cualquier otro .php: no se ejecuta
    location ~ \.php$ {
        return 404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
