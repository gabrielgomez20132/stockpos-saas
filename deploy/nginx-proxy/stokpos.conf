# Copiar en el VPS:
#   cp deploy/nginx-proxy/stokpos.conf /opt/docker/nginx-proxy/conf.d/stokpos.conf
# Ajustar server_name al dominio real y despues:
#   cd /opt/docker/nginx-proxy
#   docker compose exec nginx-proxy nginx -t && docker compose exec nginx-proxy nginx -s reload
#
# IMPORTANTE para vender sin conexion: el sitio TIENE que llegar al navegador por
# HTTPS con un certificado valido (Let's Encrypt en el proxy, o Cloudflare).
# El puerto 9011 debe coincidir con "ports" de stokpos_nginx en docker-compose.yml.

server {
    listen 80;
    server_name stokpos-saas.syncodeit.com.ar;

    client_max_body_size 40M;

    location / {
        proxy_pass http://172.17.0.1:9011;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # si el HTTPS lo hace Cloudflare, $scheme llega como http: se deja fijo https
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 300s;
    }
}
